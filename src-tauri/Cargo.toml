[package]
name = "pitstop-plus"
version = "0.1.1"
description = "Pitstop Plus: repair billing for automobile workshops"
authors = ["Skye Automotives"]
edition = "2021"

[lib]
name = "pitstop_plus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
