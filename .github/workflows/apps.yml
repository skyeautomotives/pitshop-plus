name: Build apps

# Builds the Windows installer (.exe) and the Android app (.apk).
# Run it by hand (Actions -> Build apps -> Run workflow) to get test builds,
# or push a version tag (e.g. v0.2.1) to publish them: they are attached to a
# GitHub Release (storage only) and copied onto the website's downloads/ page.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write

# The apps talk to the same Supabase project as the website. These are the public
# (publishable) values that ship inside every copy of the app anyway; repository
# variables/secrets override them if set.
env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://kbglqaagegmsmukaeldv.supabase.co' }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_rnEzfJSqiPKBL5xfKenTFg_4TnVPoWH' }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: npm ci
      - name: Build Windows installer
        run: npx tauri build
      - name: Name the installer
        shell: bash
        run: |
          mkdir out
          cp src-tauri/target/release/bundle/nsis/*.exe out/PitstopPlus-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: out/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run android:sync
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: |
          mkdir out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/PitstopPlus.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Pitstop Plus ${{ github.ref_name }}
          body: |
            **Windows:** download `PitstopPlus-Setup.exe` and run it. If Windows shows "Windows protected your PC", click *More info → Run anyway*.
            **Android:** download `PitstopPlus.apk` on the phone and open it. Allow "Install unknown apps" for your browser if asked.
            **Web:** no install needed. Use the website.
          files: out/*
      # Copy the new apps onto the website, where customers download them.
      - name: Publish the new apps on the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
