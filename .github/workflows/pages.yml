name: Deploy to GitHub Pages

# Builds the app and publishes dist/ to GitHub Pages on every push to main.
# Settings -> Pages -> Source must be "GitHub Actions".
# Uses the project's public Supabase URL and publishable key; a repository
# variable VITE_SUPABASE_URL / secret VITE_SUPABASE_ANON_KEY override them.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check Supabase settings
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://kbglqaagegmsmukaeldv.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_rnEzfJSqiPKBL5xfKenTFg_4TnVPoWH' }}
        run: |
          [ -n "$VITE_SUPABASE_URL" ] || { echo "::error::Add the VITE_SUPABASE_URL repository variable (see README)."; exit 1; }
          [ -n "$VITE_SUPABASE_ANON_KEY" ] || { echo "::error::Add the VITE_SUPABASE_ANON_KEY repository secret (see README)."; exit 1; }
          # The key is bundled into the public website, so refuse anything that isn't the public key.
          case "$VITE_SUPABASE_ANON_KEY" in
            sbp_*) echo "::error::VITE_SUPABASE_ANON_KEY is a Supabase personal access token (sbp_...). Revoke it and use the publishable key (sb_publishable_...)."; exit 1 ;;
            sb_secret_*) echo "::error::VITE_SUPABASE_ANON_KEY is a secret key (sb_secret_...). Use the publishable key (sb_publishable_...)."; exit 1 ;;
            sb_publishable_*) ;;
            eyJ*)
              role=$(echo "$VITE_SUPABASE_ANON_KEY" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | grep -o '"role":"[a-z_]*"' || true)
              [ "$role" = '"role":"anon"' ] || { echo "::error::VITE_SUPABASE_ANON_KEY is not the anon key. Never use the service_role key."; exit 1; } ;;
            *) echo "::error::VITE_SUPABASE_ANON_KEY doesn't look like a Supabase publishable key (sb_publishable_...)."; exit 1 ;;
          esac
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # The site is served from the root of https://pitshopplus.com/
          BASE_PATH: /
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://kbglqaagegmsmukaeldv.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_rnEzfJSqiPKBL5xfKenTFg_4TnVPoWH' }}
      # GitHub Pages has no rewrites: serve the app for unknown paths (e.g. /bills/123 after a refresh).
      - run: cp dist/index.html dist/404.html
      # The latest Windows and Android apps are served from the site (downloads/),
      # with downloads/latest.json telling the website and the apps which version it is.
      - name: Add the latest app downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/downloads
          if gh release view --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null 2>&1; then
            gh release download --repo "$GITHUB_REPOSITORY" --pattern 'Pit*Plus*' --dir dist/downloads
            # Apps from version 0.3.0 and earlier download the old file names.
            (cd dist/downloads
             for pair in "PitshopPlus-Setup.exe PitstopPlus-Setup.exe" "PitshopPlus.apk PitstopPlus.apk"; do
               set -- $pair
               if [ -f "$1" ]; then cp "$1" "$2"; elif [ -f "$2" ]; then cp "$2" "$1"; fi
             done)
            gh release view --repo "$GITHUB_REPOSITORY" --json tagName,publishedAt > release.json
            win=$(stat -c %s dist/downloads/PitshopPlus-Setup.exe 2>/dev/null || echo 0)
            apk=$(stat -c %s dist/downloads/PitshopPlus.apk 2>/dev/null || echo 0)
            jq --argjson w "$win" --argjson a "$apk"               '{version: (.tagName | ltrimstr("v")), published: .publishedAt, windowsSize: $w, androidSize: $a}'               release.json > dist/downloads/latest.json
            cat dist/downloads/latest.json
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
